<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF5EC">
  <meta name="robots" content="noindex">
  <title>Página no encontrada | TEC Emprende Lab</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/fonts.css?v=2">
  <link rel="stylesheet" href="/css/base.css?v=2">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; font-size: 17px; }
    header { padding: 16px 24px; border-bottom: 1px solid var(--border); }
    header img { display: block; height: 34px; width: auto; }
    main { flex: 1; display: flex; align-items: center; }
    .box { max-width: 560px; margin: 0 auto; padding: 48px 24px; }
    .code { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--orange-d); }
    h1 { margin: 8px 0 12px; font-size: clamp(28px, 6vw, 40px); line-height: 1.2; font-weight: 600; }
    p { margin: 0 0 24px; color: var(--black-2); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn { min-height: 48px; font-size: 16px; padding: 10px 20px; }
    .btn-primary { background: var(--orange-d); border-color: var(--orange-d); }
    .btn-primary:hover { background: var(--black); border-color: var(--black); }
    :focus-visible { outline: 3px solid var(--orange-d); outline-offset: 3px; }
    @media (max-width: 479px) { .actions .btn { width: 100%; } }
  </style>
</head>
<body>
  <header>
    <a href="/" aria-label="TEC Emprende Lab, ir al catálogo">
      <img src="/assets/logo-tec-emprende-lab.svg" alt="TEC Emprende Lab" width="422" height="97">
    </a>
  </header>
  <main>
    <div class="box">
      <p class="code">Error 404</p>
      <h1>No encontramos esta página</h1>
      <p>Es posible que la dirección esté mal escrita o que la página ya no exista. Desde el catálogo puede ver todos los servicios del Lab.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Ir al catálogo de servicios</a>
        <a class="btn" href="/#contacto">Contactar al Lab</a>
      </div>
    </div>
  </main>
</body>
</html>
